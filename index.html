<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">

    <title>Quiosque do Tiaguinho - Comandas</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        brand: {
                            50: '#fff7ed',
                            100: '#ffedd5',
                            500: '#f97316',
                            600: '#ea580c',
                            700: '#c2410c',
                            800: '#9a3412',
                        }
                    }
                }
            }
        }
    </script>
    <style>
        .tap-highlight-transparent {
            -webkit-tap-highlight-color: transparent;
        }
        body {
            font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            background-color: #f8fafc;
        }

</head>
<body class="bg-slate-100 min-h-screen pb-12 text-slate-800 antialiased">

    <!-- Top Header -->
    <header class="bg-gradient-to-r from-orange-600 via-amber-600 to-orange-500 text-white shadow-lg sticky top-0 z-30">
        <div class="max-w-4xl mx-auto px-4 py-3 flex items-center justify-between">
            <div class="flex items-center gap-2">
                <span class="text-2xl font-black tracking-wide flex items-center gap-1.5">
                    Quiosque do Tiaguinho
                </span>
            </div>
        </div>
    </header>

    <main class="max-w-4xl mx-auto px-4 pt-4 space-y-6">

        <!-- 1. Cadastro / Abertura de Comanda por Nome -->
        <section class="bg-white rounded-2xl shadow-sm border border-slate-200/80 p-4 sm:p-6 transition-all">
            <h2 class="text-lg font-bold text-slate-800 mb-4 flex items-center gap-2">
                <i data-lucide="plus-circle" class="w-5 h-5 text-orange-500"></i>
                Abrir / Localizar Comanda
            </h2>
            <form id="formAbrirComanda" onsubmit="handleAbrirComanda(event)" class="grid grid-cols-1 sm:grid-cols-12 gap-3 sm:gap-4">
                <div class="sm:col-span-8">
                    <label class="block text-xs font-bold text-slate-600 uppercase tracking-wider mb-1">Nome da Pessoa</label>
                    <input 
                        type="text" 
                        id="inputNome" 
                        required
                        class="w-full bg-slate-50 border border-slate-300 focus:border-orange-500 focus:ring-2 focus:ring-orange-200 rounded-xl px-3.5 py-2.5 text-slate-800 font-semibold outline-none transition-all"
                    >
                </div>
                <div class="sm:col-span-4 flex items-end">
                    <button 
                        type="submit" 
                        class="w-full bg-orange-600 hover:bg-orange-700 active:scale-95 text-white font-bold py-2.5 px-4 rounded-xl shadow-md shadow-orange-500/20 transition-all flex items-center justify-center gap-2"
                    >
                        <i data-lucide="folder-plus" class="w-5 h-5"></i>
                        <span>Abrir comanda</span>
                    </button>
                </div>
            </form>
        </section>

        <!-- Main Workspace -->
        <div class="grid grid-cols-1 lg:grid-cols-12 gap-6 items-start">

            <!-- 2. Cardápio em Categorias (Accordion) -->
            <section class="lg:col-span-7 bg-white rounded-2xl shadow-sm border border-slate-200/80 p-4 sm:p-6">
                <div class="flex items-center justify-between mb-3">
                    <h2 class="text-lg font-bold text-slate-800 flex items-center gap-2">
                        <i data-lucide="utensils" class="w-5 h-5 text-orange-500"></i>
                        Cardápio
                    </h2>
                    <span class="text-xs bg-orange-100 text-orange-800 font-medium px-2.5 py-1 rounded-full">
                        Clique no tópico para expandir
                    </span>
                </div>

                <!-- Campo de busca rápida no cardápio -->
                <div class="mb-4">
                    <input 
                        type="text" 
                        id="inputBuscaCardapio" 
                        onkeyup="filtrarCardapio()"
                        placeholder="Buscar item no cardápio..." 
                        class="w-full bg-slate-50 border border-slate-200 focus:border-orange-500 focus:ring-2 focus:ring-orange-200 rounded-xl px-3.5 py-2 text-xs font-semibold text-slate-700 outline-none transition-all"
                    >
                </div>

                <!-- Container do Cardápio Categorizado -->
                <div id="containerCardapio" class="space-y-3 max-h-[600px] overflow-y-auto pr-1">
                    <!-- Gerado via Javascript -->
                </div>
            </section>

            <!-- 3. Comanda Atual -->
            <section class="lg:col-span-5 bg-white rounded-2xl shadow-sm border border-slate-200/80 p-4 sm:p-6 sticky top-20">
                <div class="border-b border-slate-100 pb-3 mb-4">
                    <div class="flex items-center justify-between">
                        <span class="text-xs uppercase font-bold tracking-wider text-slate-400">Comanda Selecionada</span>
                        <span id="badgeStatusAtual" class="hidden text-xs font-bold px-2 py-0.5 rounded-full"></span>
                    </div>
                    <div id="headerComandaAtual" class="mt-1">
                        <p class="text-slate-400 text-sm italic">Nenhuma comanda aberta no momento.</p>
                    </div>
                </div>

                <!-- Lista de Produtos Adicionados -->
                <div id="containerItensComanda" class="space-y-2 min-h-[160px] max-h-[320px] overflow-y-auto pr-1">
                    <div class="h-40 flex flex-col items-center justify-center text-slate-400 gap-2">
                        <i data-lucide="shopping-bag" class="w-8 h-8 opacity-40"></i>
                        <p class="text-xs text-center">Informe o nome e abra uma comanda para adicionar produtos.</p>
                    </div>
                </div>

                <!-- Total e Ações -->
                <div class="border-t border-slate-100 pt-4 mt-4 space-y-4">
                    <div class="flex items-center justify-between">
                        <span class="text-slate-600 font-bold text-sm">Total da Comanda:</span>
                        <span id="txtTotalComanda" class="text-2xl font-black text-slate-900">R$ 0,00</span>
                    </div>

                    <div id="acoesComandaAtual" class="grid grid-cols-2 gap-2 hidden">
                        <button 
                            onclick="salvarComandaAtual()" 
                            class="w-full bg-slate-800 hover:bg-slate-900 active:scale-95 text-white font-bold py-2.5 px-3 rounded-xl shadow transition-all flex items-center justify-center gap-1.5 text-sm"
                        >
                            <i data-lucide="save" class="w-4 h-4 text-emerald-400"></i>
                            <span>Salvar</span>
                        </button>

                        <button 
                            onclick="finalizarComandaAtual()" 
                            class="w-full bg-emerald-600 hover:bg-emerald-700 active:scale-95 text-white font-bold py-2.5 px-3 rounded-xl shadow transition-all flex items-center justify-center gap-1.5 text-sm"
                        >
                            <i data-lucide="check-circle" class="w-4 h-4"></i>
                            <span>Finalizar comanda</span>
                        </button>
                    </div>
                </div>
            </section>
        </div>

        <!-- Lista de Comandas Salvas & Exportação -->
        <section class="bg-white rounded-2xl shadow-sm border border-slate-200/80 p-4 sm:p-6">
            <div class="flex flex-col sm:flex-row sm:items-center justify-between gap-3 mb-4">
                <div>
                    <h2 class="text-lg font-bold text-slate-800 flex items-center gap-2">
                        <i data-lucide="receipt" class="w-5 h-5 text-orange-500"></i>
                        Comandas salvas
                    </h2>
                    <p class="text-xs text-slate-500">Histórico das comandas registradas no sistema.</p>
                </div>
                
                <button 
                    onclick="exportarCSV()" 
                    class="bg-emerald-50 hover:bg-emerald-100 text-emerald-700 border border-emerald-200/80 font-bold px-4 py-2 rounded-xl text-xs sm:text-sm flex items-center justify-center gap-2 transition-all active:scale-95 shadow-sm"
                >
                    <i data-lucide="file-spread-sheet" class="w-4 h-4 text-emerald-600"></i>
                    <span>Exportar CSV</span>
                </button>
            </div>

            <!-- Filtros Rápidos -->
            <div class="flex gap-2 mb-4">
                <button onclick="filtrarComandas('todas')" id="btnFiltroTodas" class="px-3 py-1 rounded-lg text-xs font-bold bg-slate-800 text-white transition-all">Todas</button>
                <button onclick="filtrarComandas('aberta')" id="btnFiltroAbertas" class="px-3 py-1 rounded-lg text-xs font-bold bg-slate-100 text-slate-600 hover:bg-slate-200 transition-all">Abertas</button>
                <button onclick="filtrarComandas('finalizada')" id="btnFiltroFinalizadas" class="px-3 py-1 rounded-lg text-xs font-bold bg-slate-100 text-slate-600 hover:bg-slate-200 transition-all">Finalizadas</button>
            </div>

            <!-- Lista de cards -->
            <div id="gridComandasSalvas" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-3">
                <!-- Preenchido via Javascript -->
            </div>
        </section>

    </main>

            { id: 'drink-caipirinha', nome: 'Caipirinha', preco: 12.00, categoria: 'Drinks', icone: 'martini' },
            { id: 'drink-caipivodka', nome: 'CaipiVodka', preco: 14.00, categoria: 'Drinks', icone: 'martini' },
            { id: 'drink-caipifrutas', nome: 'Caipifrutas', preco: 18.00, categoria: 'Drinks', icone: 'martini', desc: 'Limão, Laranja e Morango' },
            { id: 'drink-margarita', nome: 'Margarita Tequila', preco: 24.00, categoria: 'Drinks', icone: 'martini', desc: 'Morango Frozen' }
        ];

        // ==============================
        // SUPABASE - BANCO ONLINE
        // ==============================
        const SUPABASE_URL = 'https://lfxbomcgrlgikbgtytzk.supabase.co';
        const SUPABASE_KEY = 'sb_publishable_TTlQy4vBHPbYYSd3XHFZxg_qNdy0lb0';
        const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

        let comandas = [];
        let comandaAtivaId = null;
        let filtroAtual = 'todas';
        let categoriasAbertas = {}; // Armazena o estado (aberto/fechado) das categorias
        let canalComandas = null;

        window.onload = async function() {
            await carregarComandasStorage();
            renderizarCardapio();
            renderizarComandaAtual();
            renderizarComandasSalvas();
            lucide.createIcons();
            iniciarSincronizacaoTempoReal();
        };

        // Salva as comandas no banco online. O nome da função foi mantido
        // para evitar alterar todas as partes do sistema que já a utilizam.
        async function salvarComandasStorage() {
            const comanda = comandas.find(c => c.id === comandaAtivaId);
            if (!comanda) return true;

            // Salva somente a comanda alterada para evitar que um dispositivo
            // sobrescreva alterações feitas por outro dispositivo em outras comandas.
            const registro = {
                id: comanda.id,
                nome: comanda.nome,
                itens: comanda.itens || [],
                status: comanda.status || 'aberta',
                data_criacao: comanda.dataCriacao || new Date().toISOString()
            };

            const { error } = await supabaseClient
                .from('comandas')
                .upsert(registro, { onConflict: 'id' });

            if (error) {
                console.error('Erro ao salvar comanda no Supabase:', error);
                mostrarNotificacao('Erro ao salvar a comanda no banco.');
                return false;
            }

            return true;
        }

        // Carrega as comandas do banco online.
        async function carregarComandasStorage() {
            const { data, error } = await supabaseClient
                .from('comandas')
                .select('*')
                .order('data_criacao', { ascending: false });

            if (error) {
                console.error('Erro ao carregar comandas do Supabase:', error);
                comandas = [];
                mostrarNotificacao('Não foi possível carregar as comandas.');
                return false;
            }

            comandas = (data || []).map(c => ({
                id: c.id,
                nome: c.nome,
                itens: Array.isArray(c.itens) ? c.itens : [],
                status: c.status,
                dataCriacao: c.data_criacao
            }));

            // Se a comanda ativa não existir mais no banco, limpa a seleção.
            if (comandaAtivaId && !comandas.some(c => c.id === comandaAtivaId)) {
                comandaAtivaId = null;
            }

            return true;
        }

        // Atualiza todos os dispositivos quando uma comanda é criada, alterada ou excluída.
        function iniciarSincronizacaoTempoReal() {
            if (canalComandas) {
                supabaseClient.removeChannel(canalComandas);
            }

            canalComandas = supabaseClient
                .channel('comandas-em-tempo-real')
                .on(
                    'postgres_changes',
                    {
                        event: '*',
                        schema: 'public',
                        table: 'comandas'
                    },
                    async () => {
                        const idAtivoAntes = comandaAtivaId;
                        await carregarComandasStorage();

                        // Mantém a comanda que o usuário estava visualizando, se ela ainda existir.
                        if (idAtivoAntes && comandas.some(c => c.id === idAtivoAntes)) {
                            comandaAtivaId = idAtivoAntes;
                        }

                        renderizarComandaAtual();
                        renderizarComandasSalvas();
                        lucide.createIcons();
                    }
                )
                .subscribe((status) => {
                    if (status === 'SUBSCRIBED') {
                        console.log('Sincronização em tempo real ativada.');
                    }
                });
        }

        function toggleCategoria(catNome) {
            categoriasAbertas[catNome] = !categoriasAbertas[catNome];
            renderizarCardapio();
        }

        function renderizarCardapio(itensFiltrados = CARDAPIO) {
            const container = document.getElementById('containerCardapio');
            const buscaAtiva = document.getElementById('inputBuscaCardapio')?.value.trim() !== '';

            if (itensFiltrados.length === 0) {
                container.innerHTML = `
                    <div class="py-8 text-center text-slate-400">
                        <i data-lucide="search-x" class="w-8 h-8 mx-auto mb-2 opacity-50"></i>
                        <p class="text-xs">Nenhum item encontrado.</p>
                    </div>`;
                lucide.createIcons();
                return;
            }

            // Agrupa itens por categoria
            const categorias = {};
            itensFiltrados.forEach(prod => {
                if (!categorias[prod.categoria]) {
                    categorias[prod.categoria] = [];
                }
                categorias[prod.categoria].push(prod);
            });

            container.innerHTML = Object.keys(categorias).map(catNome => {
                const produtosDaCat = categorias[catNome];
                // Se o usuário digitou algo na busca, forçamos a expansão do tópico
                const estaAberta = buscaAtiva || !!categoriasAbertas[catNome];

                return `
                    <div class="border border-slate-200 rounded-xl overflow-hidden bg-white shadow-2xs">
                        <!-- Cabeçalho do Tópico/Categoria (Clicável) -->
                        <button 
                            onclick="toggleCategoria('${catNome}')"
                            class="w-full bg-slate-50 hover:bg-slate-100 p-3.5 text-left font-bold text-slate-800 flex items-center justify-between transition-colors"
                        >
                            <div class="flex items-center gap-2">
                                <span class="text-sm font-extrabold text-slate-800">${catNome}</span>
                                <span class="text-[10px] font-bold bg-orange-100 text-orange-800 px-2 py-0.5 rounded-full">
                                    ${produtosDaCat.length}
                                </span>
                            </div>
                            <i data-lucide="${estaAberta ? 'chevron-up' : 'chevron-down'}" class="w-5 h-5 text-slate-500 transition-transform"></i>
                        </button>

                        <!-- Lista de Itens do Tópico -->
                        ${estaAberta ? `
                            <div class="p-2 space-y-2 border-t border-slate-100 bg-slate-50/50">
                                ${produtosDaCat.map(prod => `
                                    <button 
                                        onclick="adicionarProdutoComanda('${prod.id}')"
                                        class="group w-full bg-white hover:bg-orange-50/80 border border-slate-200 hover:border-orange-300 rounded-xl p-2.5 text-left transition-all active:scale-[0.98] flex items-center justify-between shadow-2xs"
                                    >
                                        <div class="flex items-center gap-2.5 min-w-0 pr-2">
                                            <div class="bg-orange-50 p-2 rounded-lg border border-orange-100 text-orange-600 flex-shrink-0">
                                                <i data-lucide="${prod.icone || 'utensils'}" class="w-4 h-4"></i>
                                            </div>
                                            <div class="min-w-0">
                                                <h3 class="font-bold text-slate-800 text-xs sm:text-sm group-hover:text-orange-700 transition-colors truncate">${prod.nome}</h3>
                                                ${prod.desc ? `<p class="text-[11px] text-slate-400 truncate">${prod.desc}</p>` : ''}
                                                <p class="text-xs text-slate-600 font-extrabold mt-0.5">${formatarMoeda(prod.preco)}</p>
                                            </div>
                                        </div>
                                        <div class="bg-slate-100 group-hover:bg-orange-500 text-slate-500 group-hover:text-white p-1.5 rounded-lg transition-colors flex-shrink-0">
                                            <i data-lucide="plus" class="w-4 h-4"></i>
                                        </div>
                                    </button>
                                `).join('')}
                            </div>
                        ` : ''}
                    </div>
                `;
            }).join('');

            lucide.createIcons();
        }

        function filtrarCardapio() {
            const termo = document.getElementById('inputBuscaCardapio').value.toLowerCase().trim();
            if (!termo) {
                renderizarCardapio(CARDAPIO);
                return;
            }

            const filtrados = CARDAPIO.filter(item => 
                item.nome.toLowerCase().includes(termo) || 
                item.categoria.toLowerCase().includes(termo) ||
                (item.desc && item.desc.toLowerCase().includes(termo))
            );

            renderizarCardapio(filtrados);
        }

        async function handleAbrirComanda(e) {
            e.preventDefault();
            const inputNome = document.getElementById('inputNome');
            const nomeStr = inputNome.value.trim();

            if (!nomeStr) return;

            let comandaExistente = comandas.find(c => c.nome.toLowerCase() === nomeStr.toLowerCase() && c.status === 'aberta');

            if (comandaExistente) {
                comandaAtivaId = comandaExistente.id;
            } else {
                const novaComanda = {
                    id: (crypto.randomUUID ? 'cmd-' + crypto.randomUUID() : 'cmd-' + Date.now()),
                    nome: nomeStr,
                    itens: [],
                    status: 'aberta',
                    dataCriacao: new Date().toISOString()
                };
                comandas.unshift(novaComanda);
                comandaAtivaId = novaComanda.id;
            }

            const salvou = await salvarComandasStorage();
            if (!salvou) return;

            renderizarComandaAtual();
            renderizarComandasSalvas();

            inputNome.value = '';
        }

        async function adicionarProdutoComanda(idProduto) {
            if (!comandaAtivaId) {
                mostrarNotificacao('Informe o nome da pessoa e abra a comanda primeiro.');
                return;
            }

            const comanda = comandas.find(c => c.id === comandaAtivaId);
            if (!comanda) return;

            if (comanda.status === 'finalizada') {
                mostrarNotificacao('Esta comanda já está finalizada.');
                return;
            }

            const itemExistente = comanda.itens.find(i => i.idProduto === idProduto);
            if (itemExistente) {
                itemExistente.quantidade += 1;
            } else {
                comanda.itens.push({ idProduto: idProduto, quantidade: 1 });
            }

            const salvou = await salvarComandasStorage();
            if (!salvou) return;

            renderizarComandaAtual();
            renderizarComandasSalvas();
        }

        async function alterarQuantidadeItem(idProduto, delta) {
            if (!comandaAtivaId) return;

            const comanda = comandas.find(c => c.id === comandaAtivaId);
            if (!comanda || comanda.status === 'finalizada') return;

            const idx = comanda.itens.findIndex(i => i.idProduto === idProduto);
            if (idx !== -1) {
                comanda.itens[idx].quantidade += delta;
                if (comanda.itens[idx].quantidade <= 0) {
                    comanda.itens.splice(idx, 1);
                }
            }

            const salvou = await salvarComandasStorage();
            if (!salvou) return;

            renderizarComandaAtual();
            renderizarComandasSalvas();
        }

        function renderizarComandaAtual() {
            const header = document.getElementById('headerComandaAtual');
            const containerItens = document.getElementById('containerItensComanda');
            const txtTotal = document.getElementById('txtTotalComanda');
            const acoes = document.getElementById('acoesComandaAtual');
            const badgeStatus = document.getElementById('badgeStatusAtual');

            const comanda = comandas.find(c => c.id === comandaAtivaId);

            if (!comanda) {
                header.innerHTML = `<p class="text-slate-400 text-sm italic">Nenhuma comanda aberta no momento.</p>`;
                containerItens.innerHTML = `
                    <div class="h-40 flex flex-col items-center justify-center text-slate-400 gap-2">
                        <i data-lucide="shopping-bag" class="w-8 h-8 opacity-40"></i>
                        <p class="text-xs text-center">Informe o nome e abra uma comanda para adicionar produtos.</p>
                    </div>`;
                txtTotal.innerText = 'R$ 0,00';
                acoes.classList.add('hidden');
                badgeStatus.classList.add('hidden');
                lucide.createIcons();
                return;
            }

            header.innerHTML = `
                <div class="flex items-baseline justify-between">
                    <h3 class="text-xl font-black text-slate-900">${escapeHtml(comanda.nome)}</h3>
                </div>
            `;

            badgeStatus.classList.remove('hidden');
            if (comanda.status === 'aberta') {
                badgeStatus.className = 'text-xs font-bold px-2 py-0.5 rounded-full bg-amber-100 text-amber-800 border border-amber-200';
                badgeStatus.innerText = 'Aberta';
            } else {
                badgeStatus.className = 'text-xs font-bold px-2 py-0.5 rounded-full bg-emerald-100 text-emerald-800 border border-emerald-200';
                badgeStatus.innerText = 'Finalizada';
            }

            let totalGeral = 0;

            if (comanda.itens.length === 0) {
                containerItens.innerHTML = `
                    <div class="h-36 flex flex-col items-center justify-center text-slate-400 gap-2">
                        <i data-lucide="plus-circle" class="w-7 h-7 opacity-30"></i>
                        <p class="text-xs text-center">Comanda vazia. Clique nos itens do cardápio ao lado para adicionar.</p>
                    </div>`;
            } else {
                containerItens.innerHTML = comanda.itens.map(item => {
                    const prod = CARDAPIO.find(p => p.id === item.idProduto) || { nome: 'Item Desconhecido', preco: 0 };
                    const totalItem = prod.preco * item.quantidade;
                    totalGeral += totalItem;

                    return `
                        <div class="flex items-center justify-between p-2.5 bg-slate-50 border border-slate-200/70 rounded-xl gap-2">
                            <div class="flex-1 min-w-0">
                                <p class="text-xs font-bold text-slate-800 truncate">${prod.nome}</p>
                                <p class="text-[11px] text-slate-500">${item.quantidade}x ${formatarMoeda(prod.preco)} = <strong class="text-slate-700">${formatarMoeda(totalItem)}</strong></p>
                            </div>
                            
                            ${comanda.status === 'aberta' ? `
                                <div class="flex items-center gap-1">
                                    <button onclick="alterarQuantidadeItem('${item.idProduto}', -1)" class="w-7 h-7 rounded-lg bg-white border border-slate-200 hover:bg-slate-100 active:scale-95 text-slate-700 font-bold flex items-center justify-center text-xs shadow-xs">
                                        -
                                    </button>
                                    <span class="w-6 text-center text-xs font-black text-slate-800">${item.quantidade}</span>
                                    <button onclick="alterarQuantidadeItem('${item.idProduto}', 1)" class="w-7 h-7 rounded-lg bg-white border border-slate-200 hover:bg-slate-100 active:scale-95 text-slate-700 font-bold flex items-center justify-center text-xs shadow-xs">
                                        +
                                    </button>
                                </div>
                            ` : `
                                <span class="text-xs font-bold bg-slate-200 text-slate-700 px-2 py-1 rounded-md">${item.quantidade}x</span>
                            `}
                        </div>
                    `;
                }).join('');
            }

            txtTotal.innerText = formatarMoeda(calcularTotalComanda(comanda));
            acoes.classList.remove('hidden');
            lucide.createIcons();
        }

        async function salvarComandaAtual() {
            if (!comandaAtivaId) return;
            const salvou = await salvarComandasStorage();
            if (salvou) mostrarNotificacao('Comanda salva com sucesso!');
        }

        async function finalizarComandaAtual() {
            if (!comandaAtivaId) return;
            const comanda = comandas.find(c => c.id === comandaAtivaId);
            if (!comanda) return;

            comanda.status = 'finalizada';
            const salvou = await salvarComandasStorage();
            if (!salvou) {
                comanda.status = 'aberta';
                return;
            }
            renderizarComandaAtual();
            renderizarComandasSalvas();
            mostrarNotificacao(`Comanda de ${comanda.nome} finalizada com sucesso!`);
        }

        function reabrirComanda(id) {
            comandaAtivaId = id;
            renderizarComandaAtual();
            document.getElementById('headerComandaAtual')?.scrollIntoView({ behavior: 'smooth', block: 'center' });
        }

        async function excluirComanda(id, e) {
            e.stopPropagation();

            const { error } = await supabaseClient
                .from('comandas')
                .delete()
                .eq('id', id);

            if (error) {
                console.error('Erro ao excluir comanda:', error);
                mostrarNotificacao('Erro ao excluir a comanda.');
                return;
            }

            comandas = comandas.filter(c => c.id !== id);
            if (comandaAtivaId === id) {
                comandaAtivaId = null;
            }

            renderizarComandaAtual();
            renderizarComandasSalvas();
            mostrarNotificacao('Comanda removida.');
        }

        function filtrarComandas(filtro) {
            filtroAtual = filtro;
            
            ['Todas', 'Abertas', 'Finalizadas'].forEach(f => {
                const btn = document.getElementById(`btnFiltro${f}`);
                if (f.toLowerCase().startsWith(filtro.substring(0, 4))) {
                    btn.className = 'px-3 py-1 rounded-lg text-xs font-bold bg-slate-800 text-white transition-all';
                } else {
                    btn.className = 'px-3 py-1 rounded-lg text-xs font-bold bg-slate-100 text-slate-600 hover:bg-slate-200 transition-all';
                }
            });

            renderizarComandasSalvas();
        }

        function renderizarComandasSalvas() {
            const container = document.getElementById('gridComandasSalvas');

            let comandasExibidas = comandas;
            if (filtroAtual === 'aberta') {
                comandasExibidas = comandas.filter(c => c.status === 'aberta');
            } else if (filtroAtual === 'finalizada') {
                comandasExibidas = comandas.filter(c => c.status === 'finalizada');
            }

            if (comandasExibidas.length === 0) {
                container.innerHTML = `
                    <div class="col-span-full py-8 text-center text-slate-400">
                        <i data-lucide="inbox" class="w-8 h-8 mx-auto mb-2 opacity-50"></i>
                        <p class="text-xs">Nenhuma comanda encontrada.</p>
                    </div>`;
                lucide.createIcons();
                return;
            }

            container.innerHTML = comandasExibidas.map(c => {
                const total = calcularTotalComanda(c);
                const isSelecionada = c.id === comandaAtivaId;
                const isAberta = c.status === 'aberta';

                return `
                    <div 
                        onclick="reabrirComanda('${c.id}')"
                        class="cursor-pointer border ${isSelecionada ? 'border-orange-500 ring-2 ring-orange-200 bg-orange-50/30' : 'border-slate-200 bg-white hover:border-slate-300'} rounded-xl p-3.5 transition-all shadow-2xs relative group"
                    >
                        <div class="flex justify-between items-start mb-2">
                            <div>
                                <span class="font-black text-slate-800 text-base">${escapeHtml(c.nome)}</span>
                            </div>
                            <span class="text-[11px] font-bold px-2 py-0.5 rounded-full ${isAberta ? 'bg-amber-100 text-amber-800 border border-amber-200' : 'bg-emerald-100 text-emerald-800 border border-emerald-200'}">
                                ${isAberta ? 'aberta' : 'finalizada'}
                            </span>
                        </div>

                        <div class="flex justify-between items-end mt-3 pt-2 border-t border-slate-100">
                            <div>
                                <span class="text-[10px] text-slate-400 uppercase font-semibold block">Total</span>
                                <span class="text-base font-extrabold text-slate-900">${formatarMoeda(total)}</span>
                            </div>
                            
                            <div class="flex items-center gap-1">
                                <button 
                                    onclick="excluirComanda('${c.id}', event)" 
                                    title="Excluir Comanda"
                                    class="p-1.5 text-slate-400 hover:text-red-600 rounded-lg hover:bg-red-50 transition-colors"
                                >
                                    <i data-lucide="trash-2" class="w-4 h-4"></i>
                                </button>
                                <span class="text-xs font-bold text-orange-600 group-hover:translate-x-0.5 transition-transform flex items-center">
                                    Abrir <i data-lucide="chevron-right" class="w-3.5 h-3.5"></i>
                                </span>
                            </div>
                        </div>
                    </div>
                `;
            }).join('');

            lucide.createIcons();
        }

        function exportarCSV() {
            if (comandas.length === 0) {
                mostrarNotificacao('Não há comandas cadastradas para exportar.');
                return;
            }

            let csvContent = '\uFEFF';
            csvContent += 'Nome;Produtos;Quantidades;Total;Status;Data\n';

            comandas.forEach(c => {
                const nomeStr = `"${c.nome.replace(/"/g, '""')}"`;

                const nomesProdutos = [];
                const qtdsProdutos = [];

                c.itens.forEach(i => {
                    const prod = CARDAPIO.find(p => p.id === i.idProduto);
                    if (prod) {
                        nomesProdutos.push(prod.nome);
                        qtdsProdutos.push(i.quantidade);
                    }
                });

                const produtosStr = `"${nomesProdutos.join(' | ')}"`;
                const quantidadesStr = `"${qtdsProdutos.join(' | ')}"`;
                const totalStr = `"${calcularTotalComanda(c).toFixed(2).replace('.', ',')}"`;
                const statusStr = c.status;
                const dataStr = new Date(c.dataCriacao || Date.now()).toLocaleDateString('pt-BR');

                csvContent += `${nomeStr};${produtosStr};${quantidadesStr};${totalStr};${statusStr};${dataStr}\n`;
            });

            const blob = new Blob([csvContent], { type: 'text/csv;charset=utf-8;' });
            const url = URL.createObjectURL(blob);
            const link = document.createElement('a');
            link.setAttribute('href', url);
            link.setAttribute('download', 'quiosque-do-tiaguinho.csv');
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);
            URL.revokeObjectURL(url);

            mostrarNotificacao('Planilha CSV gerada com sucesso!');
        }

        function calcularTotalComanda(comanda) {
            if (!comanda || !comanda.itens) return 0;
            return comanda.itens.reduce((acc, item) => {
                const prod = CARDAPIO.find(p => p.id === item.idProduto);
                return acc + (prod ? prod.preco * item.quantidade : 0);
            }, 0);
        }

        function formatarMoeda(valor) {
            return valor.toLocaleString('pt-BR', { style: 'currency', currency: 'BRL' });
        }

        function escapeHtml(string) {
            const div = document.createElement('div');
            div.innerText = string;
            return div.innerHTML;
        }

        function mostrarNotificacao(mensagem) {
            const toast = document.createElement('div');
            toast.className = 'fixed bottom-4 right-4 bg-slate-900 text-white px-4 py-3 rounded-xl shadow-2xl z-50 text-xs font-bold flex items-center gap-2 transform transition-all duration-300 translate-y-10 opacity-0';
            toast.innerHTML = `<i data-lucide="info" class="w-4 h-4 text-orange-400"></i> <span>${mensagem}</span>`;
            document.body.appendChild(toast);
            lucide.createIcons();

            setTimeout(() => {
                toast.classList.remove('translate-y-10', 'opacity-0');
            }, 10);

            setTimeout(() => {
                toast.classList.add('translate-y-10', 'opacity-0');
                setTimeout(() => toast.remove(), 300);
            }, 2500);
        }
    </script>
</body>
